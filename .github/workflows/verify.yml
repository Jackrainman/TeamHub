name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec -w apps/hub-console -- playwright install --with-deps chromium
      - run: npm run verify
      - name: Compose smoke on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/verify-hub-compose.sh
