services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: teamhub-hub:local
    env_file:
      - deploy/teamhub.env.example
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: 4177
      TEAMHUB_CONSOLE_DIST_DIR: /opt/teamhub/console
      # M11（AUDIT-FIXES 部署前必修）：容器内 KB 落盘到挂卷——否则每次重启静默丢全部
      # IssueCard/ErrorEntry/ArchiveDocument，破「AI+知识库闭环」前提。
      TEAMHUB_KB_DATA_FILE: /var/lib/teamhub/kb/kb-data.json
      ARTIFACT_ROOT: /var/lib/teamhub/artifacts
    ports:
      - "${TEAMHUB_HOST_PORT:-4177}:4177"
    volumes:
      - hub_artifacts:/var/lib/teamhub/artifacts
      - hub_kb:/var/lib/teamhub/kb
    # H5（AUDIT-FIXES 部署前必修）：删幻影 Postgres——hub-server 无 PG 客户端、从不读 DATABASE_URL，
    # 唯三 store 是 InMemoryGovStore / FileKbStore / 抛错的 SqliteGovStore stub。原 depends_on+DATABASE_URL
    # 只是白等 ~60s 健康重试 + 一个没用的容器，并误导运维以为治理数据进了 PG。SQLite 真上时再挂卷。
    # H3：HUB_HOST=0.0.0.0 暴露写端点，故 deploy/teamhub.env.example 必须配 TEAMHUB_WRITE_TOKEN（否则拒启动）。
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4177/health').then(async r => { if (!r.ok) process.exit(1); const body = await r.json(); if (body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  hub_artifacts:
  hub_kb:
