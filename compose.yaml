services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: teamhub-hub:local
    # exit code 42 = 首启动向导或设置更新请求重启。
    restart: on-failure
    env_file:
      - deploy/teamhub.env.example
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: 4177
      TEAMHUB_CONSOLE_DIST_DIR: /opt/teamhub/console
      # 六个结构化数据域共用一个 SQLite 文件与一个数据卷。
      TEAMHUB_DB_FILE: /var/lib/teamhub/data/teamhub.sqlite
      # 图纸等允许服务端持久化的二进制制品使用独立 artifact 卷。
      TEAMHUB_ARTIFACT_FILES_DIR: /var/lib/teamhub/artifacts
      TEAMHUB_WRITE_TOKEN: ${TEAMHUB_WRITE_TOKEN:-change-me-before-exposing}
    ports:
      - "${TEAMHUB_HOST_PORT:-4177}:4177"
    volumes:
      - hub_data:/var/lib/teamhub/data
      - hub_artifacts:/var/lib/teamhub/artifacts
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4177/health').then(async r => { if (!r.ok) process.exit(1); const body = await r.json(); if (body.status !== 'ok' || typeof body.buildId !== 'string' || !body.buildId) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  hub_data:
  hub_artifacts:
