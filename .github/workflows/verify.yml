name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec -w apps/hub-console -- playwright install --with-deps chromium
      - name: Verify project
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/teamhub-verify.log"
      - name: Publish failure details
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const log = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'teamhub-verify.log'), 'utf8');
          const tail = log.split(/\r?\n/).slice(-90).join('\n');
          const escaped = tail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Verification failure details::${escaped}`);
          NODE
